<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Lista de Tareas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Mi Lista de Tareas</h1>
      <p class="subtitle">Organiza tu día, una tarea a la vez</p>
    </div>

    <div class="panel">
      <div class="input-section">
        <input
          id="taskInput"
          type="text"
          placeholder="Añade una nueva tarea..."
          class="task-input"
        />
        <select id="categorySelect" class="category-select">
          <option value="trabajo">Trabajo</option>
          <option value="personal">Personal</option>
          <option value="hogar">Hogar</option>
          <option value="salud">Salud</option>
          <option value="otro">Otro</option>
        </select>
        <button id="addBtn" class="btn btn-add">Añadir</button>
      </div>

      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="active">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
      </div>

      <div class="category-filter">
        <label>Categoría:</label>
        <select id="categoryFilter" class="category-select-filter">
          <option value="">Todas las categorías</option>
          <option value="trabajo">Trabajo</option>
          <option value="personal">Personal</option>
          <option value="hogar">Hogar</option>
          <option value="salud">Salud</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">Total:</span>
          <span id="totalTasks" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Completadas:</span>
          <span id="completedTasks" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Pendientes:</span>
          <span id="pendingTasks" class="stat-value">0</span>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="tasks-section">
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✨</div>
        <p>No hay tareas que mostrar</p>
        <p class="empty-hint">¡Crea una nueva tarea para empezar!</p>
      </div>
    </div>

    <div class="panel actions-panel">
      <button id="clearCompletedBtn" class="btn btn-danger">Limpiar completadas</button>
      <button id="exportBtn" class="btn btn-primary">Exportar JSON</button>
      <button id="importBtn" class="btn btn-primary">Importar JSON</button>
      <input id="fileInput" type="file" accept=".json" style="display: none;" />
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
